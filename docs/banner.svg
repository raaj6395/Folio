<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e15"/>
      <stop offset="1" stop-color="#1a2133"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#4f8cf7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4f8cf7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="480" rx="24" fill="url(#glow)"/>

  <!-- Claude × Folio -->
  <g transform="translate(72 64)">
    <rect width="168" height="52" rx="26" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-opacity="0.55"/>
    <path d="M24 15h26a7 7 0 0 1 7 7v11a7 7 0 0 1-7 7H36l-8 6v-6h-4a7 7 0 0 1-7-7V22a7 7 0 0 1 7-7z" fill="#d97757"/>
    <text x="70" y="34" font-size="22" font-weight="700" fill="#f3d5c8">Claude</text>

    <text x="188" y="36" font-size="26" font-weight="300" fill="#8c94a8">×</text>

    <rect x="222" width="160" height="52" rx="26" fill="#4f8cf7" fill-opacity="0.14" stroke="#4f8cf7" stroke-opacity="0.55"/>
    <g transform="translate(236 8) scale(1.12)">
      <rect x="5" y="3" width="22" height="26" rx="4" fill="#4f8cf7"/>
      <rect x="9" y="3" width="2.5" height="26" fill="#2f63c9"/>
      <path d="M15 10h8M15 15h8M15 20h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <text x="282" y="34" font-size="22" font-weight="700" fill="#cfe0ff">Folio</text>

    <rect x="400" y="12" width="66" height="28" rx="14" fill="none" stroke="#8c94a8" stroke-opacity="0.6"/>
    <text x="433" y="31" font-size="14" font-weight="600" fill="#a9b1c4" text-anchor="middle">MCP</text>
  </g>

  <!-- Headline -->
  <text x="72" y="214" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Make notes with AI</text>
  <text x="74" y="262" font-size="25" fill="#a9b1c4">Ask Claude for notes. Get beautiful, printable</text>
  <text x="74" y="296" font-size="25" fill="#a9b1c4">notebook pages, written and laid out for you.</text>

  <!-- Flow -->
  <g transform="translate(74 346)" font-size="17" font-weight="600">
    <rect width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="75" y="28" fill="#e2e6ee" text-anchor="middle">💬 You ask</text>
    <text x="172" y="28" fill="#5b93f8" text-anchor="middle">→</text>
    <rect x="194" width="190" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="289" y="28" fill="#e2e6ee" text-anchor="middle">✍️ Claude writes</text>
    <text x="406" y="28" fill="#5b93f8" text-anchor="middle">→</text>
    <rect x="428" width="196" height="44" rx="22" fill="#4f8cf7" fill-opacity="0.2" stroke="#4f8cf7" stroke-opacity="0.7"/>
    <text x="526" y="28" fill="#ffffff" text-anchor="middle">📄 Folio makes pages</text>
  </g>

  <!-- Page mockup -->
  <g transform="translate(880 50) rotate(4)" filter="url(#shadow)">
    <rect width="300" height="400" rx="6" fill="#ffffff"/>
    <rect x="28" y="30" width="150" height="16" rx="3" fill="#14213d"/>
    <rect x="28" y="58" width="236" height="6" rx="3" fill="#c7cdd8"/>
    <rect x="28" y="70" width="200" height="6" rx="3" fill="#c7cdd8"/>
    <rect x="28" y="96" width="110" height="10" rx="3" fill="#14213d"/>
    <!-- diagram + steps side by side -->
    <rect x="28" y="120" width="34" height="22" rx="3" fill="none" stroke="#2563eb" stroke-width="1.6"/>
    <path d="M62 131h14" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="76" y="120" width="34" height="22" rx="3" fill="none" stroke="#2563eb" stroke-width="1.6"/>
    <path d="M110 131h12" stroke="#2563eb" stroke-width="1.6"/>
    <ellipse cx="134" cy="131" rx="12" ry="14" fill="none" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="164" y="118" width="60" height="6" rx="3" fill="#14213d"/>
    <rect x="164" y="130" width="100" height="5" rx="2.5" fill="#c7cdd8"/>
    <rect x="164" y="140" width="88" height="5" rx="2.5" fill="#c7cdd8"/>
    <rect x="164" y="150" width="94" height="5" rx="2.5" fill="#c7cdd8"/>
    <!-- table -->
    <rect x="28" y="178" width="110" height="10" rx="3" fill="#14213d"/>
    <rect x="28" y="198" width="160" height="16" fill="#e8edf7" stroke="#d1d5db"/>
    <rect x="28" y="214" width="160" height="16" fill="#fff" stroke="#d1d5db"/>
    <rect x="28" y="230" width="160" height="16" fill="#fff" stroke="#d1d5db"/>
    <rect x="28" y="246" width="160" height="16" fill="#fff" stroke="#d1d5db"/>
    <path d="M82 198v64M136 198v64" stroke="#d1d5db"/>
    <!-- callouts side by side -->
    <rect x="28" y="282" width="114" height="34" rx="3" fill="#ecfdf3"/>
    <rect x="28" y="282" width="3" height="34" fill="#16a34a"/>
    <rect x="38" y="290" width="54" height="6" rx="3" fill="#16a34a"/>
    <rect x="38" y="302" width="86" height="5" rx="2.5" fill="#9ccfb0"/>
    <rect x="150" y="282" width="114" height="34" rx="3" fill="#ecfdf3"/>
    <rect x="150" y="282" width="3" height="34" fill="#16a34a"/>
    <rect x="160" y="290" width="54" height="6" rx="3" fill="#16a34a"/>
    <rect x="160" y="302" width="86" height="5" rx="2.5" fill="#9ccfb0"/>
    <!-- Q&A card -->
    <rect x="28" y="332" width="236" height="40" rx="3" fill="none" stroke="#0f766e" stroke-width="1.4"/>
    <rect x="38" y="342" width="22" height="7" rx="3" fill="#0f766e"/>
    <rect x="66" y="342" width="150" height="7" rx="3" fill="#c7cdd8"/>
    <rect x="38" y="356" width="180" height="6" rx="3" fill="#dfe3ea"/>
  </g>
</svg>
