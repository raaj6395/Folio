<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #eceef2; color: #1d2433; }
  main { max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  a.nb { display: flex; justify-content: space-between; gap: 12px; background: #fff; padding: 14px 18px; margin: 8px 0; border-radius: 8px; text-decoration: none; color: inherit; box-shadow: 0 1px 3px #0001; }
  a.nb:hover { box-shadow: 0 2px 8px #0002; }
  .meta { color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
<main>
<h1>Folio notebooks</h1>
{{range .}}<a class="nb" href="/n/{{.ID}}"><span>{{.Title}}</span><span class="meta">{{.Theme}} · v{{.Version}} · {{.UpdatedAt.Local.Format "2006-01-02 15:04"}}</span></a>
{{else}}<p class="meta">No notebooks yet. Ask Claude to make some notes with Folio.</p>{{end}}
</main>
</body>
</html>
