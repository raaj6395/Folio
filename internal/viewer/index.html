<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio</title>
<script>
  let view = "";
  try { view = localStorage.getItem("folio-view-mode") || ""; } catch (e) {}
  document.documentElement.dataset.theme = view === "light" ? "light" : "dark";
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <span class="grow">Folio notebooks</span>
  <label class="meta">View
    <select id="view" title="How notes look in this browser; notebooks themselves are unchanged">
      <option value="">Auto</option>
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>
  </label>
</header>
<main>
{{range .}}<a class="nb" href="/n/{{.ID}}"><span>{{.Title}}</span><span class="meta">{{.Theme}} · {{.Mode}} · v{{.Version}} · {{.UpdatedAt.Local.Format "2006-01-02 15:04"}}</span></a>
{{else}}<p class="empty">No notebooks yet. Ask Claude to make some notes with Folio.</p>{{end}}
</main>
<script>
  const viewEl = document.getElementById("view");
  viewEl.value = view;
  viewEl.onchange = () => {
    view = viewEl.value;
    try { localStorage.setItem("folio-view-mode", view); } catch (e) {}
    document.documentElement.dataset.theme = view === "light" ? "light" : "dark";
  };
</script>
</body>
</html>
