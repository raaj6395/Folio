<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Folio</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #e4e6eb; color: #1d2433; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: #fff; box-shadow: 0 1px 4px #0002; }
  header a.home { color: #6b7280; text-decoration: none; }
  #title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: #6b7280; font-size: 13px; white-space: nowrap; }
  #status.off { color: #b91c1c; }
  a.btn { background: #2563eb; color: #fff; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 13px; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 28px 12px 60px; }
  .page { width: min(900px, 100%); aspect-ratio: 210 / 297; background: #fff; box-shadow: 0 2px 10px #0003; position: relative; outline: 3px solid transparent; transition: outline-color 0.6s; }
  .page img { width: 100%; height: 100%; display: block; }
  .page .num { position: absolute; right: -36px; top: 0; color: #6b7280; font-size: 12px; }
  .page.flash { outline-color: #f59e0b; transition: none; }
</style>
</head>
<body>
<header>
  <a class="home" href="/">← Notebooks</a>
  <span id="title">{{.Title}}</span>
  <span class="meta">theme <b id="theme">{{.Theme}}</b></span>
  <span class="meta">v<b id="version">{{.Version}}</b></span>
  <span class="meta" id="ago"></span>
  <span class="meta" id="status">connecting…</span>
  <a class="btn" href="/n/{{.ID}}/pdf">Download PDF</a>
</header>
<div id="pages"></div>
<script>
const id = {{.ID}};
const pagesEl = document.getElementById("pages");
let sigs = [];
let updatedAt = null;
let first = true;

function apply(s) {
  document.getElementById("title").textContent = s.title;
  document.title = s.title + " · Folio";
  document.getElementById("theme").textContent = s.theme;
  document.getElementById("version").textContent = s.version;
  updatedAt = new Date(s.updated_at);
  tick();
  for (let n = 1; n <= s.page_count; n++) {
    let div = document.getElementById("p" + n);
    if (!div) {
      div = document.createElement("div");
      div.className = "page";
      div.id = "p" + n;
      div.innerHTML = '<img alt="Page ' + n + '"><span class="num">' + n + "</span>";
      pagesEl.appendChild(div);
    }
    const sig = s.pages[n - 1];
    if (sigs[n - 1] !== sig) {
      div.querySelector("img").src = "/n/" + id + "/page/" + n + ".png?v=" + s.version + "-" + sig;
      if (!first) {
        div.classList.add("flash");
        setTimeout(() => div.classList.remove("flash"), 2000);
      }
    }
  }
  for (let n = s.page_count + 1; document.getElementById("p" + n); n++) {
    document.getElementById("p" + n).remove();
  }
  sigs = s.pages;
  first = false;
}

function tick() {
  if (!updatedAt) return;
  const sec = Math.max(0, Math.round((Date.now() - updatedAt) / 1000));
  const txt = sec < 60 ? sec + "s" : sec < 3600 ? Math.round(sec / 60) + "m" : Math.round(sec / 3600) + "h";
  document.getElementById("ago").textContent = "updated " + txt + " ago";
}
setInterval(tick, 1000);

const status = document.getElementById("status");
const es = new EventSource("/n/" + id + "/events");
es.onopen = () => { status.textContent = "live"; status.className = "meta"; };
es.onerror = () => { status.textContent = "reconnecting…"; status.className = "meta off"; };
es.onmessage = (e) => apply(JSON.parse(e.data));
es.addEventListener("gone", () => { status.textContent = "notebook deleted"; es.close(); });
</script>
</body>
</html>
