<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Folio</title>
<script>
  const notebookMode = {{.Mode}};
  let view = "";
  try { view = localStorage.getItem("folio-view-mode") || ""; } catch (e) {}
  document.documentElement.dataset.theme = view || notebookMode;
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="home" href="/">← Notebooks</a>
  <span class="grow" id="title">{{.Title}}</span>
  <span class="meta">theme <b id="theme">{{.Theme}} · {{.Mode}}</b></span>
  <span class="meta">v<b id="version">{{.Version}}</b></span>
  <span class="meta" id="ago"></span>
  <span class="meta" id="status">connecting…</span>
  <label class="meta">View
    <select id="view" title="Only changes how you see the notes here; the notebook itself is unchanged. Auto follows the notebook's own mode.">
      <option value="">Auto</option>
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>
  </label>
  <a class="btn" id="pdf" href="/n/{{.ID}}/pdf">Download PDF</a>
</header>
<div id="pages"></div>
<script>
const id = {{.ID}};
const pagesEl = document.getElementById("pages");
const viewEl = document.getElementById("view");
const status = document.getElementById("status");
let sigs = [];
let updatedAt = null;
let first = true;
let es = null;
viewEl.value = view;
const q = () => (view ? "?mode=" + view : "");

function apply(s) {
  document.getElementById("title").textContent = s.title;
  document.title = s.title + " · Folio";
  document.getElementById("theme").textContent = s.theme + " · " + s.mode;
  document.getElementById("version").textContent = s.version;
  document.documentElement.dataset.theme = s.mode;
  document.getElementById("pdf").href = "/n/" + id + "/pdf" + q();
  updatedAt = new Date(s.updated_at);
  tick();
  for (let n = 1; n <= s.page_count; n++) {
    let div = document.getElementById("p" + n);
    if (!div) {
      div = document.createElement("div");
      div.className = "page";
      div.id = "p" + n;
      div.innerHTML = '<img alt="Page ' + n + '"><span class="num">' + n + "</span>";
      pagesEl.appendChild(div);
    }
    const sig = s.pages[n - 1];
    if (sigs[n - 1] !== sig) {
      div.querySelector("img").src = "/n/" + id + "/page/" + n + ".png?v=" + s.version + "-" + sig + (view ? "&mode=" + view : "");
      if (!first) {
        div.classList.add("flash");
        setTimeout(() => div.classList.remove("flash"), 2000);
      }
    }
  }
  for (let n = s.page_count + 1; document.getElementById("p" + n); n++) {
    document.getElementById("p" + n).remove();
  }
  sigs = s.pages;
  first = false;
}

function tick() {
  if (!updatedAt) return;
  const sec = Math.max(0, Math.round((Date.now() - updatedAt) / 1000));
  const txt = sec < 60 ? sec + "s" : sec < 3600 ? Math.round(sec / 60) + "m" : Math.round(sec / 3600) + "h";
  document.getElementById("ago").textContent = "updated " + txt + " ago";
}
setInterval(tick, 1000);

function connect() {
  if (es) es.close();
  sigs = [];
  first = true;
  es = new EventSource("/n/" + id + "/events" + q());
  es.onopen = () => { status.textContent = "live"; status.className = "meta"; };
  es.onerror = () => { status.textContent = "reconnecting…"; status.className = "meta off"; };
  es.onmessage = (e) => apply(JSON.parse(e.data));
  es.addEventListener("gone", () => { status.textContent = "notebook deleted"; es.close(); });
}

viewEl.onchange = () => {
  view = viewEl.value;
  try { localStorage.setItem("folio-view-mode", view); } catch (e) {}
  document.documentElement.dataset.theme = view || notebookMode;
  connect();
};
connect();
</script>
</body>
</html>
